{% load static %}
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход в кабинет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="{% static 'css/cabinet.css' %}?v=1">
</head>
<body>
<div class="cab-login-wrap">
  <form class="cab-login-card" method="post">
    {% csrf_token %}
    <h1>🩺 Вход в кабинет</h1>
    <p class="sub">Управление вашим сайтом</p>
    {% if error %}<div class="cab-login-err">{{ error }}</div>{% endif %}
    <div class="cab-field">
      <label for="id_username">Логин</label>
      <input class="cab-input" type="text" name="username" id="id_username" autocomplete="username" autofocus required>
    </div>
    <div class="cab-field">
      <label for="id_password">Пароль</label>
      <input class="cab-input" type="password" name="password" id="id_password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="cab-btn cab-btn-lg">Войти</button>
  </form>
</div>
</body>
</html>
