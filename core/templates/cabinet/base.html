{% load static %}
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Кабинет{% endblock %} · Доктор Гвоздев</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="{% static 'css/cabinet.css' %}?v=1">
</head>
<body>
{% if user.is_staff %}
<header class="cab-top">
  <a href="{% url 'cabinet' %}" class="cab-brand">🩺 Кабинет</a>
  <div class="cab-top-right">
    <a href="{% url 'home' %}" target="_blank" rel="noopener" class="cab-link">Открыть сайт ↗</a>
    <a href="{% url 'cabinet_logout' %}" class="cab-link cab-logout">Выйти</a>
  </div>
</header>
{% endif %}

<main class="cab-main">
  {% block back %}{% endblock %}

  {% if messages %}
  <div class="cab-messages">
    {% for m in messages %}
      <div class="cab-msg">✓ {{ m }}</div>
    {% endfor %}
  </div>
  {% endif %}

  {% block content %}{% endblock %}
</main>
</body>
</html>
